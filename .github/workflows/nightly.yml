# Wavemaker nightly — rolling binary distribution (WM-DB).
# Delivery surface is the single rolling `nightly` GitHub Release, never a
# version tag. A scheduled build publishes; workflow_dispatch is the manual
# immediate-build path (and always builds, bypassing the gate).
#
# Four legs: linux-x86_64, linux-aarch64 (bare binaries), windows-x86_64
# (zip: wm.exe + wm-mcp.exe) and macos-aarch64 (tar.gz: wm + wm-mcp, Apple
# Silicon). The Windows/macOS legs are first-run faces: compile + unit-test
# verification; PLATFORM-NOTES in each package says what was and was not
# accepted (no real-game-server end-to-end on those platforms yet).
# Each leg also builds the desktop (Tauri) app: bare binary tar.gz on
# Linux (webkit2gtk runtime deps listed inside; xvfb window smoke),
# msi on Windows (WebView2), dmg on macOS (unsigned — Gatekeeper note).
# macos-15 (not macos-14 — that image retired from GitHub Actions on
# 2026-11-02); the plain label is arm64.
name: nightly

on:
  schedule:
    # Off-peak non-round minute (21:17 UTC = 05:17 CST daily)
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    name: Staleness gate (48h)
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        name: Skip when no fresh commits
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "manual trigger — always build"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head_age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          echo "HEAD age: ${head_age}s"
          if [ "$head_age" -le $((48*3600)) ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "no fresh commits in 48h — skipping build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-aarch64 }
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-15, name: macos-aarch64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Root workspace plus the standalone desktop crate (own lockfile
          # and target dir — carved out of the root workspace, WM-0601).
          workspaces: |
            .
            desktop/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Install protoc + desktop system libs (apt)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb xdotool
      - name: Install protoc (choco)
        if: runner.os == 'Windows'
        run: choco install protoc -y --no-progress
      - name: Install protoc (brew)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Build release (full workspace)
        if: runner.os != 'Windows'
        run: cargo build --workspace --release
      - name: Build release (CLI + MCP)
        if: runner.os == 'Windows'
        run: cargo build --release -p wm-cli -p wm-mcp
      - name: Unit tests (workspace)
        if: runner.os == 'macOS'
        run: cargo test --release --workspace
      - name: Unit tests (CLI + MCP)
        if: runner.os == 'Windows'
        run: cargo test --release -p wm-cli -p wm-mcp
      - name: Smoke gate
        if: runner.os != 'Windows'
        run: |
          set -e
          ./target/release/wm --version
          printf 'arrival:\n  ramp:\n    from_per_second: 1\n    to_per_second: 20\n    duration_secs: 600\nlifetime:\n  distribution: exponential\n  mean_secs: 900\nsaturation_policy: queue\n' > /tmp/good.yaml
          ./target/release/wm validate /tmp/good.yaml
          printf 'lifetime:\n  distribution: fixed\n  mean_secs: 900\n' > /tmp/bad.yaml
          if ./target/release/wm validate /tmp/bad.yaml; then
            echo "FAIL: bad config validated with exit 0" >&2
            exit 1
          fi
      - name: Smoke gate (Windows)
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = "Stop"
          @'
          arrival:
            ramp:
              from_per_second: 1
              to_per_second: 20
              duration_secs: 600
          lifetime:
            distribution: exponential
            mean_secs: 900
          saturation_policy: queue
          '@ | Set-Content -Path "$env:TEMP\good.yaml"
          & ./target/release/wm.exe --version
          & ./target/release/wm.exe validate "$env:TEMP\good.yaml"
          if ($LASTEXITCODE -ne 0) {
            throw "FAIL: good config did not validate (exit $LASTEXITCODE)"
          }
          @'
          lifetime:
            distribution: fixed
            mean_secs: 900
          '@ | Set-Content -Path "$env:TEMP\bad.yaml"
          & ./target/release/wm.exe validate "$env:TEMP\bad.yaml"
          if ($LASTEXITCODE -eq 0) {
            throw "FAIL: bad config validated with exit 0"
          }
          # pwsh propagates the last native exit code as the process exit
          # code; the rejection above is intentional, so end explicitly.
          exit 0
      - name: Desktop web deps (pnpm)
        run: pnpm --dir desktop/web install --frozen-lockfile
      # tauri build runs the configured beforeBuildCommand (vite build) and
      # then cargo-builds the standalone desktop crate with the bundled
      # frontend (custom-protocol). dlx's first args go straight to the
      # tauri bin — the subcommand is `build`, not `tauri build`.
      - name: Build desktop (Linux, bare binary)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: pnpm dlx '@tauri-apps/cli@^2' build --no-bundle
      - name: Build desktop (Windows msi)
        if: runner.os == 'Windows'
        working-directory: desktop
        run: pnpm dlx '@tauri-apps/cli@^2' build --bundles msi
      - name: Build desktop (macOS dmg)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: pnpm dlx '@tauri-apps/cli@^2' build --bundles dmg
      - name: Desktop smoke (window appears under xvfb)
        if: runner.os == 'Linux'
        run: |
          set -e
          xvfb-run -a bash -c '
            ./desktop/src-tauri/target/release/wavemaker-desktop &
            APP_PID=$!
            sleep 8
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "FAIL: desktop app exited early" >&2
              exit 1
            fi
            if ! xdotool search --name "Wavemaker" >/dev/null; then
              echo "FAIL: no Wavemaker window" >&2
              kill $APP_PID 2>/dev/null || true
              exit 1
            fi
            echo "OK: Wavemaker window is up"
            kill $APP_PID 2>/dev/null || true
          '
      - name: Stage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          mkdir -p dist
          cd dist
          cp "../target/release/wm" "wavemaker-${{ matrix.name }}"
          sha256sum "wavemaker-${{ matrix.name }}" > "wavemaker-${{ matrix.name }}.sha256"
          {
            echo "Wavemaker nightly build"
            echo "platform: ${{ matrix.name }}"
            echo "built:    $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "commit:   ${GITHUB_SHA}"
            echo "verify:   ./wavemaker-${{ matrix.name }} --version"
            echo "caveat:   unsigned binary — SmartScreen/Gatekeeper may warn"
            echo "desktop:  wavemaker-nightly-desktop-${{ matrix.name }}.tar.gz — Tauri GUI,"
            echo "          runtime needs webkit2gtk-4.1/gtk3 (list in DEPENDENCIES.txt"
            echo "          inside the tarball); verified by xvfb window smoke only"
          } > "PLATFORM-NOTES-${{ matrix.name }}.txt"
          # Desktop (Tauri): bare binary + dependency list (AppImage is a
          # later phase).
          mkdir -p desktop-pkg
          cp "../desktop/src-tauri/target/release/wavemaker-desktop" desktop-pkg/wavemaker-desktop
          {
            echo "Wavemaker nightly desktop (Tauri GUI)"
            echo "commit: ${GITHUB_SHA}"
            echo "runtime deps (Debian/Ubuntu package names):"
            echo "  libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2"
            echo "run: ./wavemaker-desktop   (window titled Wavemaker)"
            echo "scope: first-run face — compiled plus an xvfb window smoke"
            echo "       (window appears); not yet accepted on a real desktop session"
          } > desktop-pkg/DEPENDENCIES.txt
          tar -czf "wavemaker-nightly-desktop-${{ matrix.name }}.tar.gz" -C desktop-pkg wavemaker-desktop DEPENDENCIES.txt
          sha256sum "wavemaker-nightly-desktop-${{ matrix.name }}.tar.gz" > "wavemaker-nightly-desktop-${{ matrix.name }}.tar.gz.sha256"
      - name: Stage (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          mkdir -p dist
          tar -czf "dist/wavemaker-${{ matrix.name }}.tar.gz" -C target/release wm wm-mcp
          cd dist
          shasum -a 256 "wavemaker-${{ matrix.name }}.tar.gz" > "wavemaker-${{ matrix.name }}.tar.gz.sha256"
          {
            echo "Wavemaker nightly build"
            echo "platform: ${{ matrix.name }} (Apple Silicon)"
            echo "built:    $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "commit:   ${GITHUB_SHA}"
            echo "contents: wm, wm-mcp (inside the tar.gz)"
            echo "verify:   tar -xzf wavemaker-${{ matrix.name }}.tar.gz && ./wm --version"
            echo "sha256:   shasum -a 256 wavemaker-${{ matrix.name }}.tar.gz"
            echo "quarantine: first launch may need: xattr -d com.apple.quarantine wm"
            echo "scope:    first-run leg — compile + full workspace unit tests only;"
            echo "          not yet end-to-end accepted against a real game server on macOS"
            echo "desktop:  wavemaker-nightly-desktop-macos-aarch64.dmg — Tauri GUI, unsigned;"
            echo "          right-click Open on first launch (Gatekeeper). Build + package"
            echo "          sanity only — not yet click-tested on macOS"
            echo "caveat:   unsigned binary — Gatekeeper may warn"
          } > "PLATFORM-NOTES-${{ matrix.name }}.txt"
          cp ../desktop/src-tauri/target/release/bundle/dmg/*.dmg "wavemaker-nightly-desktop-${{ matrix.name }}.dmg"
          shasum -a 256 "wavemaker-nightly-desktop-${{ matrix.name }}.dmg" > "wavemaker-nightly-desktop-${{ matrix.name }}.dmg.sha256"
      - name: Stage (Windows)
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/wm.exe dist/
          Copy-Item target/release/wm-mcp.exe dist/
          Compress-Archive -Path dist/wm.exe, dist/wm-mcp.exe `
            -DestinationPath "dist/wavemaker-${{ matrix.name }}.zip" -Force
          Remove-Item dist/wm.exe, dist/wm-mcp.exe
          $hash = (Get-FileHash "dist/wavemaker-${{ matrix.name }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  wavemaker-${{ matrix.name }}.zip" |
            Out-File "dist/wavemaker-${{ matrix.name }}.zip.sha256" -Encoding ascii
          @"
          Wavemaker nightly build
          platform: ${{ matrix.name }}
          built:    $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm UTC'))
          commit:   $env:GITHUB_SHA
          contents: wm.exe, wm-mcp.exe (inside the zip)
          verify:   expand the zip, then .\wm.exe --version
          sha256:   Get-FileHash wavemaker-${{ matrix.name }}.zip -Algorithm SHA256
          desktop:  wavemaker-nightly-desktop-windows-x86_64.msi — Tauri GUI; needs
                    the WebView2 runtime (preinstalled on Win11 and updated Win10)
          scope:    first-run leg — compile + unit tests (wm-cli, wm-mcp) only;
                    the server-side components are not packaged for Windows yet;
                    not yet end-to-end accepted against a real game server on Windows
                    desktop msi is build + package sanity only, not yet click-tested
          caveat:   unsigned binaries — SmartScreen may warn
          "@ | Out-File "dist/PLATFORM-NOTES-${{ matrix.name }}.txt" -Encoding utf8
          Copy-Item desktop/src-tauri/target/release/bundle/msi/*.msi `
            "dist/wavemaker-nightly-desktop-${{ matrix.name }}.msi"
          $dhash = (Get-FileHash "dist/wavemaker-nightly-desktop-${{ matrix.name }}.msi" -Algorithm SHA256).Hash.ToLower()
          "$dhash  wavemaker-nightly-desktop-${{ matrix.name }}.msi" |
            Out-File "dist/wavemaker-nightly-desktop-${{ matrix.name }}.msi.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: dist/
          retention-days: 1

  publish:
    name: Publish rolling nightly
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: pkgs
      - id: stamp
        name: Capture run start (github.run_started_at is unreliable)
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Publish to rolling nightly Release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_STARTED: ${{ steps.stamp.outputs.started }}
        run: |
          set -e
          tag=nightly
          # delete-and-recreate the ROLLING release (never a version tag)
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" pkgs/* \
            --target "$GITHUB_SHA" \
            --title "nightly $(date -u +%Y-%m-%d)" \
            --prerelease \
            --notes "Rolling nightly build of ${GITHUB_SHA}. Built with stable rust. Assets: wavemaker-linux-x86_64, wavemaker-linux-aarch64 (bare binaries), wavemaker-windows-x86_64.zip (wm.exe + wm-mcp.exe), wavemaker-macos-aarch64.tar.gz (Apple Silicon) — each with a .sha256 and PLATFORM-NOTES. Desktop (Tauri GUI): wavemaker-nightly-desktop-linux-x86_64.tar.gz and wavemaker-nightly-desktop-linux-aarch64.tar.gz (bare GUI binary + DEPENDENCIES.txt; needs webkit2gtk-4.1, xvfb window-smoke only), wavemaker-nightly-desktop-windows-x86_64.msi (WebView2; build sanity only), wavemaker-nightly-desktop-macos-aarch64.dmg (unsigned — right-click Open; build sanity only). The Windows/macOS CLI legs are compile + unit-test verified only; see each PLATFORM-NOTES. This is a rolling prerelease binary, not a versioned release." || true
          # never leave a draft as the delivery surface
          gh release edit "$tag" --draft=false 2>/dev/null || true
          # assert the publish actually landed (green-but-unshipped must fail)
          released_at=$(gh release view "$tag" --json publishedAt --jq .publishedAt)
          echo "release publishedAt=$released_at run started=$RUN_STARTED"
          if [ -z "$released_at" ]; then
            echo "FAIL: release has no publishedAt" >&2
            exit 1
          fi
          asset_count=$(gh release view "$tag" --json assets --jq 'length')
          echo "assets=$asset_count"
          if [ "$asset_count" -eq 0 ]; then
            echo "FAIL: zero assets on nightly" >&2
            exit 1
          fi
      - name: Summary
        run: |
          {
            echo "## Wavemaker nightly"
            echo "- rolling Release **nightly** (only copy; history cleaned)"
            echo "- assets: \`wavemaker-linux-x86_64\`, \`wavemaker-linux-aarch64\`, \`wavemaker-windows-x86_64.zip\`, \`wavemaker-macos-aarch64.tar.gz\`, desktop (Tauri): \`wavemaker-nightly-desktop-*\` (linux tar.gz / windows msi / macos dmg) + per-asset \`.sha256\` + PLATFORM-NOTES"
            echo "- download: https://github.com/cuihairu/wavemaker/releases/tag/nightly"
          } >> "$GITHUB_STEP_SUMMARY"

name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc (proto codegen)
        # The ubuntu apt mirror (azure.archive.ubuntu.com) has flaky DNS on
        # hosted runners; the GitHub release CDN is the reliable path.
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            curl -fsSL -o /tmp/protoc.zip \
              https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
            sudo unzip -o /tmp/protoc.zip bin/protoc 'include/*' -d /usr/local
          fi
          protoc --version

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

[package]
name = "wavemaker-desktop"
version = "0.1.0"
edition = "2021"
description = "Wavemaker desktop dashboard (Tauri shell)"
license = "Apache-2.0"

# Standalone crate: carve this app out of the enclosing root workspace so
# the core `cargo test --workspace` / clippy gate never drags in Tauri.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Production builds embed the bundled frontend only with this feature
# (`tauri build` passes it; plain cargo builds stay in dev mode and load
# the devUrl dev server).
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
# The webview calls the controller REST API through this plugin, so the
# request is made from the Rust side and never trips webview CORS.
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
# Password hashing for the local users file (WM-0607; ADR-009).
sha2 = "0.10"
hex = "0.4"
# Spectrum validation reuses the same engine as `wm validate` (wm-core)
# so the desktop report can never drift from the CLI. The load timeline
# reuses wm-runtime's ArrivalPlan for the same reason.
wm-core = { path = "../../crates/wm-core" }
wm-runtime = { path = "../../crates/wm-runtime" }

[dev-dependencies]
tempfile = "3"

[lib]
name = "wavemaker_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1250" viewBox="0 0 1280 1250" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">Wavemaker · 系统架构</title>
<desc id="desc">Wavemaker 系统架构：Web Dashboard 与 CLI 经 HTTP/WebSocket 访问 Wavemaker Controller（Rust + Axum + Tokio，提供 Plan / Backend / Report 三个 API）；计划与结果经 Protobuf 控制协议到达 Native Worker 与 Engine Bot Supervisor 两个执行后端；Supervisor 经本地 IPC/RPC 管理 Engine Bot Process（KBEngine Bots、C++ Runtime、Python Bridge）；指标汇入 Basin（Topology / Providers / Metric Mapping / Queries，Prometheus / OTel / Custom）并进入 Swell Report Pipeline。实线为业务请求与结果，虚线为注册与管理。</desc>
